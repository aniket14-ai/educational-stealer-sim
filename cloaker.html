<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cloaking Simulation | Cybersecurity Awareness</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0a0f1a;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #121826;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      color: #00ffff;
      text-align: center;
      margin-bottom: 20px;
    }
    .message {
      font-size: 1rem;
      text-align: center;
      line-height: 1.6;
    }
    .bot-message {
      color: #33ff99;
    }
    .user-message {
      color: #ff4f4f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🕵️ Website Cloaking Simulation</h2>
    <div id="cloakMessage" class="message">Detecting your environment...</div>
  </div>

  <script>
    function isCrawler() {
      const userAgent = navigator.userAgent.toLowerCase();
      const crawlerKeywords = [
        "googlebot", "bingbot", "slurp", "duckduckbot", "baiduspider",
        "yandexbot", "sogou", "exabot", "facebookexternalhit", "facebot", "ia_archiver"
      ];

      return crawlerKeywords.some(bot => userAgent.includes(bot));
    }

    window.onload = function () {
      const msg = document.getElementById("cloakMessage");

      if (isCrawler()) {
        msg.innerHTML = `
          <p class="bot-message">🤖 Hello Googlebot!<br>This is a simple public blog page.</p>
        `;
      } else {
        msg.innerHTML = `
          <p class="user-message">⚠️ Suspicious Page Loaded!<br>
          You're seeing this because you're not a crawler.<br>
          In real attacks, this could be a phishing or malware page.</p>
        `;
      }
    };
  </script>
</body>
</html>
